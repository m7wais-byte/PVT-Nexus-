<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PVT Nexus — Sample Bottle Designs</title>
<!-- same font link as the simulator (index.html); system fonts are used offline -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="bottles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <img class="logo" src="../../assets/logo.png" alt="VAPS">
    <div class="ttl">
      <div class="eyebrow">PVT NEXUS · DESIGN REVIEW</div>
      <h1>Sample Bottle Designs</h1>
    </div>
    <div class="ctl" role="group" aria-label="Bottle">
      <span class="cl">Bottle</span>
      <div class="seg" id="showSeg"><button type="button" data-v="both">Compare both</button><button type="button" data-v="oil">Oil Sample Bottle</button><button type="button" data-v="gas">Gas Sample Bottle</button></div>
    </div>
    <div class="ctl" role="group" aria-label="View">
      <span class="cl">View</span>
      <div class="seg" id="viewSeg"><button type="button" data-v="exterior">Exterior</button><button type="button" data-v="cutaway">Cutaway</button><button type="button" data-v="pair">Exterior + cutaway</button></div>
    </div>
    <div class="ctl" role="group" aria-label="Orientation">
      <span class="cl">Orientation</span>
      <div class="seg" id="oriSeg"><button type="button" data-v="upright">Upright</button><button type="button" data-v="horizontal">Horizontal</button></div>
    </div>
    <label class="sw"><input type="checkbox" id="lblChk" checked><span></span><em>Labels</em></label>
    <button class="btn" id="themeBtn" type="button">Light background</button>
  </header>

  <main id="grid" class="grid" aria-live="polite"></main>

  <footer class="foot">
    <span>Representative technical illustrations based on manufacturer references, not replicas of a specific product. Not to scale between manufacturers; no process or operating data shown.</span>
    <span class="legend" id="legend"></span>
  </footer>
</div>
<script src="bottle-draw.js"></script>
<script src="app.js"></script>
</body>
</html>
